<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#061628"><title>Basic RT PRO 3.8.3 · Herstelcontrole</title><style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif}*{box-sizing:border-box}body{background:#071827;color:#f3faff;margin:0;padding:23px 15px;line-height:1.45}.wrap{max-width:580px;margin:auto}h1{font-size:25px;margin:6px 0}p{color:#c6d7e5}button,.btn{min-height:48px;border-radius:12px;border:1px solid #6bb4c9;background:#153f59;color:#effaff;font-weight:780;padding:12px 14px;font-size:14px;margin:5px 5px 6px 0;display:inline-flex;align-items:center;text-decoration:none}.btn.primary{background:#0c7ac0}.box{background:#112b40;border:1px solid #3b6279;padding:14px;margin:13px 0;border-radius:14px}.status{border:1px solid #4b697a;border-radius:11px;padding:10px 12px;margin:7px 0;font-size:13px;overflow-wrap:anywhere}.ok{border-color:#518e7a;color:#abffe0}.bad{border-color:#c47e74;color:#ffd0c5}.warn{color:#ffd99d;font-size:12px}.meta{color:#abc4d4;font-size:13px}.small{font-size:12px}</style></head><body><div class="wrap">
<div class="meta">BASIC RT PRO / TECHNISCHE TEST</div><h1>Controle 3.8.3</h1><p>Controleer of <strong>alle bestanden</strong> bereikbaar zijn en of Se-75 en Ir-192 weer rekenen.</p>
<a class="btn primary" href="./index.html?v=383">Open de calculator</a><button id="run" type="button">Opnieuw controleren</button><button id="repair" type="button">Oude offline-cache wissen</button>
<div class="box"><strong id="overall">Controle wordt gestart…</strong><div id="out" aria-live="polite"></div></div><p class="warn">Een softwaretest betekent niet dat de belichtingstijden voor werkelijke RT-opnames zijn gevalideerd.</p>
<script>
(function(){
 const $=id=>document.getElementById(id),out=$('out');
 const essential=['index.html','styles.css','app.mjs','ui-polish.mjs','material-equivalence.mjs','rt-core.mjs','rt-curves.mjs','film-response.mjs','iqi.mjs','procedure-ui.mjs','rt-procedure.mjs','reference-tools.mjs','reference-data.mjs','xray-extra-curves.mjs','reference-recovery.mjs','sw.js'];
 function line(ok,msg){const div=document.createElement('div');div.className='status '+(ok?'ok':'bad');div.textContent=(ok?'✓ ':'✕ ')+msg;out.append(div);return ok;}
 async function run(){out.replaceChildren();$('overall').textContent='Bestanden en berekeningen worden gecontroleerd…';let fails=0;
 for(const file of essential){try{const r=await fetch('./'+file+'?control=383-'+Date.now(),{cache:'no-store'});const type=r.headers.get('content-type')||'';if(!(r.ok&&!type.includes('text/html')||r.ok&&file.endsWith('.html'))){line(false,file+' niet beschikbaar (HTTP '+r.status+')');fails++;}}catch(err){line(false,file+': '+err.message);fails++;}}
 if(fails===0)line(true,essential.length+' essentiële bestanden gevonden');
 try{
 const [{calculateGamma},{curves}]=await Promise.all([import('./rt-core.mjs?v=383-control'),import('./rt-curves.mjs?v=383-control')]);
 for(const [iso,mm,expected] of [['Se-75',10,868],['Ir-192',20,667]]){
  const r=calculateGamma({isotope:iso,film:'D4',thicknessMm:mm,density:2,activityCi:40,distanceMm:800,material:'Fe'},curves);
  const sec=r.ok?Math.round(r.minutes*60):NaN;const msg=iso+' / D4 / '+mm+' mm: '+(r.ok?Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0'):'geblokkeerd')+' (verwacht '+Math.floor(expected/60)+':'+String(expected%60).padStart(2,'0')+')';
  if(!line(r.ok&&sec===expected,msg))fails++;
 }
 }catch(err){line(false,'Import- of rekenfout: '+err.message);fails++;}
 $('overall').textContent=fails===0?'GESLAAGD — alle modules en 2 rekencontroles OK':'PROBLEEM — '+fails+' fout(en)';$('overall').style.color=fails?'#ffbda9':'#a4ffe0';
 }
 $('run').addEventListener('click',run);
 $('repair').addEventListener('click',async()=>{const btn=$('repair');btn.disabled=true;btn.textContent='Offline-cache wordt geleegd…';
 try{if('serviceWorker' in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.filter(r=>r.scope.startsWith(new URL('./',location.href).href)).map(r=>r.unregister()));}}catch(err){line(false,'Service worker reset: '+err.message)}
 try{if('caches' in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>k.startsWith('basic-rt-pro-')).map(k=>caches.delete(k)));}}catch(err){line(false,'Cache reset: '+err.message)}
 location.href='./controle.html?v=383-'+Date.now();});
 run();
})();
</script></div></body></html>
