name: Safe live material UI regression
on:
  pull_request:
    paths:
      - 'index.html'
      - 'styles.css'
      - 'app.mjs'
      - 'compact-layout.mjs'
      - 'rt-material-ui.mjs'
      - 'sw.js'
      - 'research/live-material-preview*'
      - 'research/waygate-six-user-points-unverified.json'
      - '.github/workflows/live-material-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research-ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Research material UI, supported engine ranges and syntax
        run: |
          node --test research/live-material-preview.test.mjs
          node --check app.mjs
          node --check compact-layout.mjs
          node --check rt-material-ui.mjs
          node --check research/live-material-preview.mjs
      # test-3.8.mjs is an older non-current baseline: it asserts a valid
      # Se-75 D=1.4 exposure which the present guarded core intentionally
      # rejects. Keep it unchanged pending an independent test-suite review.
