name: Safe live material UI regression
on:
  pull_request:
    paths:
      - 'index.html'
      - 'styles.css'
      - 'app.mjs'
      - 'compact-layout.mjs'
      - 'rt-material-ui.mjs'
      - 'sw.js'
      - 'research/live-material-preview*'
      - 'research/waygate-six-user-points-unverified.json'
      - '.github/workflows/live-material-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research-ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Research material UI and main engine regression
        run: |
          node --test research/live-material-preview.test.mjs
          node test-3.8.mjs
