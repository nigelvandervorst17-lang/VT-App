name: Branding icons and exposure engine regression
on:
  pull_request:
    paths:
      - 'brand/**'
      - 'index.html'
      - 'mobile-shell.mjs'
      - 'mobile-shell.css'
      - 'mobile-shell.test.mjs'
      - 'research/live-material-preview.test.mjs'
      - 'private-naslag.mjs'
      - 'private-naslag.test.mjs'
      - 'reference-data.mjs'
      - 'reference-tools.mjs'
      - 'reference-recovery.mjs'
      - 'se75.html'
      - 'se75-quick.mjs'
      - 'se75-quick.test.mjs'
      - 'research/company-suite/**'
      - 'styles.css'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'research/brand-logos.test.mjs'
      - '.github/workflows/ndt-branding.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  logo-and-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify logos, research guards and original models
        run: |
          node --test research/brand-logos.test.mjs research/live-material-preview.test.mjs mobile-shell.test.mjs se75-quick.test.mjs private-naslag.test.mjs
          node --check se75-quick.mjs
          node --check private-naslag.mjs
          node --check reference-tools.mjs
          node --check mobile-shell.mjs
          node --check research/company-suite/company-app.mjs
          node --check research/company-suite/supabase-rest.mjs
          node --check app.mjs
          node --check sw.js
          node --check rt-material-ui.mjs
          node --check rt-core.mjs
